# Local merge gates. Installed automatically by `pnpm install` (root "prepare" script).
# Fast checks on commit, full checks on push, so CI failures are rare surprises, not routine.

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}
    format:
      glob: "*.{ts,tsx,json,md,yml}"
      run: pnpm exec prettier --check {staged_files}
    secrets:
      # Node, not inline sh: lefthook on Windows breaks multi-line `sh -c` scripts.
      run: node scripts/git-hooks/check-staged-env.mjs

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    concurrency:
      # Only when the push touches the claim path, or on a branch's first push.
      run: node scripts/git-hooks/pre-push-concurrency.mjs
