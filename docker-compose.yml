# Local Postgres + Redis. `docker compose up -d`, then `pnpm db:migrate && pnpm db:seed`.
name: surge

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surge
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on a fresh volume. For an existing volume: pnpm db:readonly-role
      - ./scripts/readonly-role.sql:/docker-entrypoint-initdb.d/10-readonly-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d surge"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # AOF persistence: Redis is authoritative during a live drop (SPEC §4).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
